<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact - Zemiki</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,600&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <main>
    <section class="page-hero"><div class="wrap"><h1>Get in Touch</h1><p>We'd love to hear from you</p></div></section>
    <section class="section">
      <div class="wrap about-split">
        <div>
          <div class="eyebrow">Contact us</div>
          <h2>Questions? Custom orders?</h2>
          <p style="color:var(--muted)">Send us a message and our team will get back to you. For the fastest response, reach us on WhatsApp.</p>
          <div id="contactInfo" style="margin-top:20px"></div>
        </div>
        <div class="summary" style="position:static">
          <h3>Send a message</h3>
          <form id="contactForm">
            <div class="field"><label>Your Name *</label><input name="name" required></div>
            <div class="field"><label>Phone</label><input name="phone"></div>
            <div class="field"><label>Email</label><input type="email" name="email"></div>
            <div class="field"><label>Message *</label><textarea name="message" rows="4" required></textarea></div>
            <button class="btn btn-primary btn-block btn-lg" type="submit">Send Message</button>
          </form>
        </div>
      </div>
    </section>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/cart.js"></script>
  <script src="/js/layout.js"></script>
  <script>
    (function () {
      document.addEventListener('layout:ready', function (e) {
        var cfg = e.detail.config;
        if (cfg.whatsapp_number) {
          document.getElementById('contactInfo').innerHTML =
            '<a class="btn btn-whatsapp btn-lg" target="_blank" rel="noopener" href="' +
            Z.whatsappUrl(cfg.whatsapp_number, 'Hi Zemiki, I have a question') + '">Chat on WhatsApp</a>';
        }
      });
      document.getElementById('contactForm').addEventListener('submit', async function (ev) {
        ev.preventDefault();
        var fd = new FormData(ev.target);
        var btn = ev.target.querySelector('button');
        btn.disabled = true; btn.textContent = 'Sending…';
        try {
          await Z.postJSON('/api/enquiries', {
            name: fd.get('name'), phone: fd.get('phone'),
            email: fd.get('email'), message: fd.get('message'),
          });
          ev.target.innerHTML = '<div style="text-align:center;padding:20px"><h3>Thank you!</h3><p style="color:var(--muted)">We\'ve received your message and will reply soon.</p></div>';
        } catch (err) {
          Z.toast(err.message || 'Could not send', 'error');
          btn.disabled = false; btn.textContent = 'Send Message';
        }
      });
    })();
  </script>
</body>
</html>
